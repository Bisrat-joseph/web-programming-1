<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Design Workshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

  <!-- Top Banner -->
  <header class="bg-dark text-white py-5">
    <div class="container">
      <span class="badge text-bg-warning mb-3">Free workshop</span>
      <h1 class="display-5 fw-bold">Web Design Workshop</h1>
      <p class="lead mb-0">Build your first responsive webpage with HTML and Bootstrap.</p>
    </div>
  </header>

  <!-- Main Content Grid -->
  <main class="container my-4 my-md-5">
    <div class="row g-4">

      <!-- Left Column: Event Info -->
      <aside class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="h4 card-title mb-3">Workshop details</h2>

            <div class="mb-3">
              <div class="fw-bold">Day</div>
              <div>Saturday</div>
            </div>

            <div class="mb-3">
              <div class="fw-bold">Location</div>
              <div>School computer lab</div>
            </div>

            <div>
              <div class="fw-bold">What to bring</div>
              <div>A laptop and charger</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Right Column: Registration Form -->
      <section class="col-md-7">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="h4 card-title mb-3">Register for a session</h2>

            <form action="#" method="get">
              <div class="mb-3">
                <label class="form-label" for="studentName">Full name</label>
                <input type="text" class="form-control" id="studentName" name="studentName" autocomplete="name" required>
              </div>

              <div class="mb-3">
                <label class="form-label" for="studentEmail">Email address</label>
                <input type="email" class="form-control" id="studentEmail" name="studentEmail" autocomplete="email" required>
              </div>

              <div class="mb-4">
                <p class="fs-6 fw-semibold mb-2">Choose a session</p>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="timeSlot" id="slotMorning" value="morning" required>
                  <label class="form-check-label" for="slotMorning">
                    Morning · 9:00–11:00 AM
                  </label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="timeSlot" id="slotAfternoon" value="afternoon" required>
                  <label class="form-check-label" for="slotAfternoon">
                    Afternoon · 2:00–4:00 PM
                  </label>
                </div>
              </div>

              <div class="d-grid d-sm-inline-block">
                <button type="submit" class="btn btn-primary px-4">Register</button>
              </div>

              <div class="form-text mt-3">Practice form. Entries are discarded.</div>
            </form>
          </div>
        </div>
      </section>

    </div>
  </main>

</body>
</html>
